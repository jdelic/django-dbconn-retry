[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dbconn-retry"
version = "0.3.3"
description = "Patch Django to retry a database connection first before failing."
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Jonas Maurus (@jdelic)", email = "jonas-dbconn-retry@gopythongo.com" },
]
maintainers = [
  { name = "GoPythonGo.com", email = "info@gopythongo.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
]
urls = { Homepage = "https://github.com/jdelic/django-dbconn-retry/" }
dependencies = []

[tool.setuptools]
packages = ["django_dbconn_retry"]
# MANIFEST.in adds the tests to the sdist, keep them out of the wheel
include-package-data = false
